services:
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: pgvector
    
    ports:
      - "54329:5432"
    volumes:
      - pgvector:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  pgvector:


